name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-cpu:
    runs-on: ubuntu-latest
    name: Linux CPU build (gcc)
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPT_USE_CUDA=OFF \
            -DPT_USE_OPENMP=ON \
            -DPT_USE_AVX2=ON \
            -DPT_BUILD_TESTS=ON

      - name: Build core + test binaries
        # Собираем САМИ test-таргеты (c10_tests/aten_tests), иначе ctest ниже
        # получал c10_tests_NOT_BUILT — тесты не строились и «падали» без
        # запуска. torch_autograd подтянется транзитивно как зависимость.
        run: cmake --build build --target c10_tests aten_tests torch_autograd -j $(nproc)

      # Core unit tests — БЕЗ `|| true`. Это контракт: ядро обязано проходить
      # тесты, иначе badge краснеет (audit 2026-05-20 _build_ci #6 / 2026-06-02).
      - name: Run c10 unit tests
        working-directory: build
        run: ctest --output-on-failure -R c10_tests

      - name: Run ATen unit tests
        working-directory: build
        run: ctest --output-on-failure -R aten_tests

  # Examples собираются отдельной advisory-job: видны в списке проверок, но
  # НЕ валят основной build (они зависят от per-platform toolchain, часть —
  # known-broken, например train_mnist_cnn 12.55% random acc). Раньше были
  # `|| true` внутри основной job — это маскировало и реальные регрессии ядра.
  examples-advisory:
    runs-on: ubuntu-latest
    name: Examples build (advisory, non-blocking)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPT_USE_CUDA=OFF -DPT_USE_OPENMP=ON \
            -DPT_USE_AVX2=ON -DPT_BUILD_TESTS=OFF
      - name: Build examples (advisory)
        run: |
          for t in train_mnist_mlp train_transformer train_vit shakespeare_train train_pir; do
            echo "::group::$t"
            cmake --build build --target "$t" -j "$(nproc)" || echo "::warning::example $t failed to build"
            echo "::endgroup::"
          done

  build-windows-cpu:
    # windows-latest уехал на Server 2025, где generator "Visual Studio 17
    # 2022" не находит инстанс VS → CMake Error at project(). Пин на
    # windows-2022 (образ с VS 2022 и рабочим генератором).
    runs-on: windows-2022
    name: Windows CPU build (MSVC)
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 ^
            -DPT_USE_CUDA=OFF ^
            -DPT_USE_OPENMP=OFF ^
            -DPT_USE_AVX2=ON ^
            -DPT_BUILD_TESTS=OFF

      - name: Build torch_autograd
        run: cmake --build build --config Release --target torch_autograd -j

  build-macos-cpu:
    # macos-latest уехал на Apple Silicon (arm64), где clang не принимает
    # x86-флаг -mavx (просачивается несмотря на PT_USE_AVX2=OFF). Пин на
    # macos-13 (Intel) чинит -mavx, но Intel-раннеры дефицитны (очередь 60+ мин).
    # macOS — НЕ целевая платформа (Эльбрус/NVIDIA/x86/NM Card), поэтому job
    # advisory: не валит бейдж из-за scarcity/arm64. Виден в списке проверок.
    runs-on: macos-13
    continue-on-error: true
    name: macOS CPU build (clang, advisory)
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install cmake ninja libomp

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPT_USE_CUDA=OFF \
            -DPT_USE_OPENMP=OFF \
            -DPT_USE_AVX2=OFF \
            -DPT_BUILD_TESTS=OFF

      - name: Build torch_autograd
        run: cmake --build build --target torch_autograd -j $(sysctl -n hw.ncpu)
