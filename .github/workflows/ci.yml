name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, НЕ windows-latest: latest уехал на Server 2025, где
        # generator "Visual Studio 17 2022" не находит инстанс VS.
        os: [ubuntu-latest, windows-2022]
        include:
          - os: ubuntu-latest
            cmake_gen: "Unix Makefiles"
          - os: windows-2022
            cmake_gen: "Visual Studio 17 2022"

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libomp-dev

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DPT_BUILD_TESTS=ON
        -DPT_USE_CUDA=OFF
        -DPT_USE_TUDA=OFF

    # Build only the core stack (c10 + aten_cpu + torch_autograd). Building
    # `all` pulls in optional examples whose targets are guarded by
    # `if(EXISTS ...)` blocks but may still fail on different runner toolchains.
    # The core stack is the contract — if it builds and tests pass, badge stays
    # green even if a peripheral example is broken on a particular platform.
    - name: Build core + test binaries
      # Собираем сами core test-бинарники. Backend-специфичные тесты
      # (ddp/fsdp/linq/nmcard/deepspeed) требуют железа/сетапа и НЕ гейтят
      # CPU-CI — их не строим и не гоняем (ctest ниже фильтрует по -R).
      run: cmake --build build --config Release --target c10_tests aten_tests autograd_full_tests optimizer_tests torch_autograd -j 4

    # Tests must really pass — раньше тут стоял continue-on-error: true,
    # из-за чего зелёный badge ничего не гарантировал (audit 2026-05-20
    # _build_ci #6). Если ядро не проходит тесты — CI обязан краснеть.
    - name: Run C++ Tests (core suites)
      working-directory: build
      # Только core-сьюты (совпадает с build.yml). Bare `ctest` гонял ВСЕ 13
      # зарегистрированных тестов, включая несобранные backend-специфичные →
      # «13 of 13 failed». Эти четыре аудит верифицировал как проходящие
      # (c10 — после фикса ArrayRef-тестов P1-4).
      run: ctest --output-on-failure -C Release -R "c10_tests|aten_tests|autograd_full_tests|optimizer_tests"

  # STATS drift gate — STATS.md/json должны совпадать с реальным кодом.
  # Ловит расхождения числовых claim'ов (audit 2026-06-02 _claims_drift:
  # backward 112/119/121, CUDA 92/99/149 в разных местах README).
  stats-check:
    name: STATS drift check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify STATS.md/json up to date
      run: python scripts/gen_stats.py --check

  # PromeServe integration tests (tests/promeserve/). Раньше гонялись только
  # вручную через scripts/test_promeserve_tools.sh — самый ценный незакрытый
  # CI-gap (audit 2026-06-02 _cicd). Здесь — без continue-on-error: security
  # regression (path traversal) ОБЯЗАНА проходить.
  promeserve-pytest:
    name: PromeServe integration tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libomp-dev
        python -m pip install --upgrade pip pytest
    - name: Build promeserve
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DPT_USE_CUDA=OFF -DPT_BUILD_TESTS=OFF
        cmake --build build --target promeserve -j "$(nproc)"
    - name: Run PromeServe pytest battery
      env:
        PROMESERVE_BIN: ${{ github.workspace }}/build/promeserve/promeserve
      run: pytest -v tests/promeserve/
