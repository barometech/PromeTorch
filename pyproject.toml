[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "promethorch"
version = "0.1.0a1"
description = "Deep learning framework with native support for Russian CPUs (Эльбрус, Baikal) and accelerators (NM Card / NM Quad)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{name = "PromeTorch Contributors"}]
keywords = [
    "deep-learning",
    "machine-learning",
    "neural-networks",
    "pytorch-alternative",
    "elbrus",
    "e2k",
    "baikal",
    "russian-hardware",
    "nmcard",
    "vliw",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy"]
docs = ["sphinx>=5.0", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/barometech/PromeTorch"
Repository = "https://github.com/barometech/PromeTorch"
Issues = "https://github.com/barometech/PromeTorch/issues"
Documentation = "https://github.com/barometech/PromeTorch/blob/main/README.md"

[tool.setuptools]
packages = ["promethorch"]
package-dir = {"promethorch" = "python/promethorch"}
