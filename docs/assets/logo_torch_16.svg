<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="256" height="256">
  <title>PromeTorch — Pixel Torch (16x16)</title>
  <!-- Прометей дал людям огонь. Torch = факел.
       Не «Prometheus+Torch» (с лишней H), а Prome + Torch. -->

  <!-- Background transparent -->

  <!-- Outer flame (red/orange) -->
  <rect x="6"  y="0" width="1" height="1" fill="#FF6A00"/>
  <rect x="9"  y="0" width="1" height="1" fill="#FF6A00"/>
  <rect x="5"  y="1" width="1" height="1" fill="#FF6A00"/>
  <rect x="7"  y="1" width="2" height="1" fill="#FFB000"/>
  <rect x="10" y="1" width="1" height="1" fill="#FF6A00"/>
  <rect x="4"  y="2" width="1" height="1" fill="#D63600"/>
  <rect x="5"  y="2" width="1" height="1" fill="#FF6A00"/>
  <rect x="6"  y="2" width="4" height="1" fill="#FFB000"/>
  <rect x="10" y="2" width="1" height="1" fill="#FF6A00"/>
  <rect x="11" y="2" width="1" height="1" fill="#D63600"/>
  <rect x="3"  y="3" width="1" height="1" fill="#D63600"/>
  <rect x="4"  y="3" width="1" height="1" fill="#FF6A00"/>
  <rect x="5"  y="3" width="6" height="1" fill="#FFB000"/>
  <rect x="11" y="3" width="1" height="1" fill="#FF6A00"/>
  <rect x="12" y="3" width="1" height="1" fill="#D63600"/>

  <!-- Inner flame core (yellow / white-hot) -->
  <rect x="4"  y="4" width="1" height="1" fill="#FF6A00"/>
  <rect x="5"  y="4" width="1" height="1" fill="#FFB000"/>
  <rect x="6"  y="4" width="4" height="1" fill="#FFEC58"/>
  <rect x="10" y="4" width="1" height="1" fill="#FFB000"/>
  <rect x="11" y="4" width="1" height="1" fill="#FF6A00"/>
  <rect x="5"  y="5" width="1" height="1" fill="#FF6A00"/>
  <rect x="6"  y="5" width="1" height="1" fill="#FFB000"/>
  <rect x="7"  y="5" width="2" height="1" fill="#FFFFFF"/>
  <rect x="9"  y="5" width="1" height="1" fill="#FFB000"/>
  <rect x="10" y="5" width="1" height="1" fill="#FF6A00"/>
  <rect x="6"  y="6" width="1" height="1" fill="#FF6A00"/>
  <rect x="7"  y="6" width="2" height="1" fill="#FFEC58"/>
  <rect x="9"  y="6" width="1" height="1" fill="#FF6A00"/>
  <rect x="7"  y="7" width="2" height="1" fill="#FFB000"/>

  <!-- Torch handle (dark wood) -->
  <rect x="6"  y="8"  width="4" height="1" fill="#6B3F1B"/>
  <rect x="6"  y="9"  width="1" height="1" fill="#5A2F12"/>
  <rect x="7"  y="9"  width="2" height="1" fill="#8B5A2B"/>
  <rect x="9"  y="9"  width="1" height="1" fill="#5A2F12"/>
  <rect x="6"  y="10" width="4" height="1" fill="#6B3F1B"/>
  <rect x="6"  y="11" width="1" height="1" fill="#5A2F12"/>
  <rect x="7"  y="11" width="2" height="1" fill="#8B5A2B"/>
  <rect x="9"  y="11" width="1" height="1" fill="#5A2F12"/>
  <rect x="6"  y="12" width="4" height="1" fill="#6B3F1B"/>
  <rect x="6"  y="13" width="1" height="1" fill="#5A2F12"/>
  <rect x="7"  y="13" width="2" height="1" fill="#8B5A2B"/>
  <rect x="9"  y="13" width="1" height="1" fill="#5A2F12"/>
  <rect x="6"  y="14" width="4" height="1" fill="#6B3F1B"/>
  <rect x="6"  y="15" width="4" height="1" fill="#3F2008"/>
</svg>
